<title>北陸大学卓球部 インスタ素材メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Oswald:wght@500;700&display=swap">
<style>
/* メニュー：どの素材を作るか選ぶだけのページ。ストーリー・フィード・リールのページと同じ色に揃えて、迷わず行き来できるようにする */
:root {
  --bg: #e9eef2; --surface: #ffffff; --ink: #122330; --muted: #5d6e7b; --line: #d3dce3;
  --table: #1d5c3a; --table-deep: #0f3a24; --on-table: #ffffff; --ball: #c9a032;
  --font: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --num: "Oswald", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d151b; --surface: #16212a; --ink: #e6edf2; --muted: #91a2af; --line: #283843;
    --table: #2a7a4e; --table-deep: #164a2f; --ball: #e0bb4a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d151b; --surface: #16212a; --ink: #e6edf2; --muted: #91a2af; --line: #283843;
  --table: #2a7a4e; --table-deep: #164a2f; --ball: #e0bb4a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
.hero {
  border-radius: 16px; color: var(--on-table);
  background: linear-gradient(160deg, var(--table), var(--table-deep));
  padding: 26px 22px 24px; box-shadow: inset 0 0 0 5px rgba(255,255,255,.9);
}
.hero .eyebrow { font-family: var(--num); letter-spacing: .18em; font-size: .78rem; opacity: .8; text-transform: uppercase; }
.hero h1 { margin: 2px 0 6px; font-size: clamp(1.5rem, 6vw, 2.2rem); font-weight: 900; line-height: 1.25; text-wrap: balance; }
.hero p { margin: 0; opacity: .9; }
.menu { display: grid; gap: 12px; }
@media (min-width: 640px) { .menu { grid-template-columns: 1fr 1fr; } }
.item {
  display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  color: var(--ink); text-decoration: none; min-height: 96px;
}
a.item:hover, a.item:focus-visible { border-color: var(--table); box-shadow: 0 0 0 2px var(--table); outline: none; }
.icon { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: var(--table); color: #fff; }
.icon svg { width: 28px; height: 28px; }
.item strong { display: block; font-size: 1.05rem; font-weight: 900; }
.item span { display: block; font-size: .85rem; color: var(--muted); }
.item.soon { opacity: .55; }
.item.soon .icon { background: var(--muted); }
.tag { display: inline-block; font-size: .7rem; font-weight: 700; color: var(--ball); border: 1px solid currentColor; border-radius: 99px; padding: 0 8px; margin-left: 6px; vertical-align: middle; }
.note { font-size: .82rem; color: var(--muted); margin: 0; }
</style>

<div class="wrap">
  <header class="hero">
    <div class="eyebrow">Hokuriku Univ. Table Tennis</div>
    <h1>インスタ素材メーカー</h1>
    <p>作りたいものを選んで、写真と文字を入れるだけ。</p>
  </header>

  <nav class="menu" aria-label="作るもの">
    <a class="item" href="story.html">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></div>
      <div><strong>試合結果ストーリー</strong><span>団体戦のオーダーとスコアを縦長画像に</span></div>
    </a>
    <a class="item" href="feed.html">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M3.5 8h17M3.5 16h17"/><path d="m8 13 2-2 3 3 2-1.5"/></svg></div>
      <div><strong>大会報告フィード</strong><span>集合写真に大会名・会場・日付の帯を付ける</span></div>
    </a>
    <a class="item" href="reel.html">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="m10 9.5 5 2.5-5 2.5z"/></svg></div>
      <div><strong>リール動画</strong><span>プレー動画に選手名と見出しの帯を付ける</span></div>
    </a>
    <div class="item soon" aria-disabled="true">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l6 4V6L7 10z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg></div>
      <div><strong>活動報告・お知らせ<em class="tag">準備中</em></strong><span>清掃活動、新キャプテン発表など</span></div>
    </div>
  </nav>

  <p class="note">スマホでは「ホーム画面に追加」しておくと、アプリのようにすぐ開けます。</p>
</div>
